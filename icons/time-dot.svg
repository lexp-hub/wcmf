<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Digital Clock Case / Display Frame -->
  <rect x="2" y="5" width="20" height="14" rx="3" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
  <!-- Matrix Digit '1' -->
  <circle cx="5.5" cy="8.5" r="1.1" fill="currentColor"/>
  <circle cx="5.5" cy="12" r="1.1" fill="currentColor"/>
  <circle cx="5.5" cy="15.5" r="1.1" fill="currentColor"/>
  <!-- Matrix Digit '0' -->
  <circle cx="8.5" cy="8.5" r="1.1" fill="currentColor"/>
  <circle cx="11" cy="8.5" r="1.1" fill="currentColor"/>
  <circle cx="8.5" cy="12" r="1.1" fill="currentColor"/>
  <circle cx="11" cy="12" r="1.1" fill="currentColor"/>
  <circle cx="8.5" cy="15.5" r="1.1" fill="currentColor"/>
  <circle cx="11" cy="15.5" r="1.1" fill="currentColor"/>
  <!-- Colon ':' -->
  <circle cx="13" cy="10" r="0.9" fill="#FFFFFF"/>
  <circle cx="13" cy="14" r="0.9" fill="#FFFFFF"/>
  <!-- Matrix Digit '0' -->
  <circle cx="15" cy="8.5" r="1.1" fill="currentColor"/>
  <circle cx="18" cy="8.5" r="1.1" fill="currentColor"/>
  <circle cx="15" cy="12" r="1.1" fill="currentColor"/>
  <circle cx="18" cy="12" r="1.1" fill="currentColor"/>
  <circle cx="15" cy="15.5" r="1.1" fill="currentColor"/>
  <circle cx="18" cy="15.5" r="1.1" fill="currentColor"/>
</svg>
